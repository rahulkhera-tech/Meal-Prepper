name: Build static recipe database
on:
  workflow_dispatch:
  schedule:
    - cron: '20 18 * * 0'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python build_recipes.py
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes.json
          git diff --cached --quiet || git commit -m "Build 1000-recipe static database"
          git push
