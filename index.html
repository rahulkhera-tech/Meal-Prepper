<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meal Prepper</title><style>
:root{--c:#8a5a44;--b:#eadfd7;--m:#6e645d}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f6f1ea;color:#2b2622}.wrap{max-width:1200px;margin:auto;padding:20px}.hero,.card,.meal{background:#fff;border:1px solid var(--b);border-radius:20px;padding:18px}.hero{margin-bottom:16px}.bar{display:grid;grid-template-columns:1fr repeat(3,.7fr) .8fr;gap:10px}.bar>*{padding:11px;border-radius:12px;border:1px solid var(--b);background:#fff}.bar button,.primary{background:var(--c);color:#fff;border:0}.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.meal.selected{background:#fbf4ee}.meta,.small{color:var(--m);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a,.actions button,.side button{padding:9px 11px;border-radius:11px;border:1px solid var(--b);background:#fff;text-decoration:none;color:#2b2622;font-weight:700}.actions .primary,.side .primary{background:var(--c);color:#fff;border:0}.side{display:grid;gap:14px;align-self:start;position:sticky;top:12px}.ing{line-height:1.5;padding-left:20px}@media(max-width:850px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.bar{grid-template-columns:1fr}.side{position:static}}</style></head><body><div class="wrap">
<section class="hero"><h1>Meal Prepper</h1><p class="small">Static RecipeTin Eats meal database. Five cards are always maintained where the selected filters have enough matches.</p><div class="bar"><input id="q" placeholder="Search"><select id="protein"><option value="all">All proteins</option><option value="chicken">Chicken</option><option value="pork">Pork</option><option value="fish">Fish</option><option value="lamb">Lamb</option><option value="vegetarian">Vegetarian</option></select><select id="rating"><option value="all">Any rating</option><option value="4.5">4.5+ stars</option><option value="4.7">4.7+ stars</option><option value="4.9">4.9+ stars</option></select><select id="time"><option value="all">Any time</option><option value="30">≤30 min</option><option value="45">≤45 min</option><option value="60">≤60 min</option></select><button id="refresh">Refresh meals</button></div><p id="status" class="small">Loading recipes.json…</p></section>
<div class="layout"><main id="grid" class="grid"></main><aside class="side"><section class="card"><h2>Selected</h2><div id="selected" class="small">No meals selected.</div></section><section class="card"><h2>Ingredients</h2><div id="ingredients" class="small">Select a recipe.</div><div class="actions"><button id="copy" class="primary">Copy ingredients</button></div></section></aside></div></div>
<script>
const $=x=>document.getElementById(x);let db=[],shown=[],sel=new Map();const order=['chicken','pork','fish','vegetarian','lamb'];
const hist=()=>{try{return JSON.parse(localStorage.getItem('mealHist')||'[]')}catch{return[]}};function addHist(id){let h=hist().filter(x=>x!==id);h.unshift(id);localStorage.setItem('mealHist',JSON.stringify(h.slice(0,80)))}
function rank(r){let recent=hist().indexOf(r.id);return (r.rating||0)*100000+(r.votes||0)*5-(recent<0?0:(80-recent)*20)+Math.random()*10}
function ok(r){let q=$('q').value.toLowerCase().trim(),mr=$('rating').value==='all'?0:+$('rating').value,mt=$('time').value==='all'?Infinity:+$('time').value;if(q&&!r.title.toLowerCase().includes(q))return false;if(mr&&(r.rating==null||r.rating<mr))return false;if(mt<Infinity&&(r.time==null||r.time>mt))return false;return true}
function pool(p){return db.filter(r=>r.protein===p&&ok(r)).sort((a,b)=>rank(b)-rank(a))}function pick(a,used){let x=a.filter(r=>!used.has(r.id));if(!x.length)return null;return x[Math.floor(Math.pow(Math.random(),2.4)*Math.min(30,x.length))]}
function generate(){sel.clear();let p=$('protein').value,u=new Set(),n=[];if(p==='all'){for(const k of order){let r=pick(pool(k),u);if(r){u.add(r.id);n.push(r)}}}else{let a=pool(p);for(let i=0;i<5;i++){let r=pick(a,u);if(r){u.add(r.id);n.push(r)}}}shown=n;render()}
function refreshOne(i){let p=$('protein').value==='all'?shown[i].protein:$('protein').value,u=new Set(shown.map(r=>r.id)),r=pick(pool(p),u);if(r){sel.delete(shown[i].id);shown[i]=r;render()}}
function toggle(id){let r=shown.find(x=>x.id===id);if(sel.has(id))sel.delete(id);else{sel.set(id,r);addHist(id)}render()}
function ingredients(){let m=new Map();for(const r of sel.values())for(const raw of r.ingredients||[]){let key=raw.toLowerCase().replace(/\s+/g,' ').trim();if(!m.has(key))m.set(key,raw)}return [...m.values()].sort()}
function render(){ $('grid').innerHTML=shown.length?shown.map((r,i)=>`<article class="meal ${sel.has(r.id)?'selected':''}"><h3>${r.title}</h3><div class="meta">${r.protein}${r.time?' · '+r.time+' min':''}${r.rating?' · ★ '+r.rating.toFixed(2)+' ('+r.votes+')':''}</div><div class="actions"><a class="primary" target="_blank" rel="noreferrer" href="${r.url}">View recipe</a><button onclick="refreshOne(${i})">Refresh meal</button><button onclick="toggle('${r.id}')">${sel.has(r.id)?'✓ Unselect':'Select'}</button></div></article>`).join(''):'<section class="card"><b>No recipes match these filters.</b></section>';let s=[...sel.values()];$('selected').innerHTML=s.length?s.map(r=>'✓ '+r.title).join('<br>'):'No meals selected.';let ing=ingredients();$('ingredients').innerHTML=ing.length?'<ul class="ing">'+ing.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'Select a recipe.'}
$('refresh').onclick=generate;['q','protein','rating','time'].forEach(id=>$(id).addEventListener(id==='q'?'change':'change',generate));$('copy').onclick=async()=>{let t=ingredients().join('\n');if(t)await navigator.clipboard.writeText(t)};
fetch('recipes.json').then(r=>{if(!r.ok)throw Error('recipes.json missing');return r.json()}).then(x=>{db=x;$('status').textContent=`${db.length} prebuilt recipes loaded`;generate()}).catch(e=>{$('status').textContent=e.message;$('grid').innerHTML='<section class="card"><b>Recipe database not built yet.</b><p>Run the “Build static recipe database” GitHub Action, then reload.</p></section>'});
</script></body></html>
